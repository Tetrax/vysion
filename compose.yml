services:
  vysion:
    image: vysion:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      subnet-docker:
        ipv4_address: ${VYSION_IPV4_ADDRESS:-172.30.250.11}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8080:8443"
    environment:
      VYSION_REPORT_DIRECTORY: /app/data/reports
      VYSION_REPORT_TTL_SECONDS: ${REPORT_TTL_SECONDS:-3600}
      VYSION_MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}
      VYSION_FORTIGUARD_STATUS_URL: ${FORTIGUARD_STATUS_URL:-https://www.fortiguard.com/}
      VYSION_TLS_SERVER_NAME: ${TLS_SERVER_NAME:-vysion.internal.example}
    volumes:
      - vysion-reports:/app/data/reports
      - type: bind
        source: ${TLS_CERTS_DIR:-/opt/vysion/tls}
        target: /run/vysion/tls
        read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/run:size=1m,uid=10001,gid=10001,mode=755
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: ${MEM_LIMIT:-512m}
    cpus: ${CPU_LIMIT:-1.0}
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error --cacert /run/vysion/tls/tls.crt --resolve $${VYSION_TLS_SERVER_NAME}:8443:127.0.0.1 https://$${VYSION_TLS_SERVER_NAME}:8443/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  vysion-reports:

networks:
  subnet-docker:
    external: true
    name: ${DOCKER_NETWORK_NAME:-Subnet-Docker}
