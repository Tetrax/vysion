# Standalone deployment, OFFLINE distribution: same hardening and same
# volumes as compose.standalone.yml, but the image is referenced by its
# local tag instead of an OCI digest, because an image tar imported through
# Portainer (Images → Import) carries its tag — never its registry digest.
#
# The supplier ships `vysion-sha-<commit>.tar` (docker save, linux/amd64);
# the operator imports it in Portainer, then uploads THIS file through
# Stacks → Add stack → Upload with:
#
#   VYSION_IMAGE=ghcr.io/tetrax/vysion:sha-<commit>   (the imported tag)
#   VYSION_TLS_HOSTNAME=vysion.client.example
#
# Immutability therefore rests on the tar archive itself (verify the sha256
# the supplier states through your transfer channel) rather than on a
# registry digest: that is the documented offline trade-off. The online
# path (compose.standalone.yml) tracks the promoted `stable` channel
# instead, whose digest and revision stay verifiable (decision 0011).
services:
  vysion:
    image: ${VYSION_IMAGE:?set VYSION_IMAGE to the imported image tag ghcr.io/tetrax/vysion:sha-<commit>}
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-443}:443"
    environment:
      VYSION_REPORT_DIRECTORY: /app/data/reports
      VYSION_REPORT_TTL_SECONDS: ${REPORT_TTL_SECONDS:-3600}
      VYSION_MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}
      VYSION_FORTIGUARD_STATUS_URL: ${FORTIGUARD_STATUS_URL:-https://www.fortiguard.com/}
      VYSION_TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-127.0.0.1/32}
      VYSION_PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      VYSION_TLS_BACKEND: local
      VYSION_TLS_HOSTNAME: ${VYSION_TLS_HOSTNAME:?set VYSION_TLS_HOSTNAME to the DNS name this instance serves}
    volumes:
      - vysion-reports:/app/data/reports
      - vysion-state:/app/data/state
      - vysion-certs:/app/certs
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/run:size=1m,uid=10001,gid=10001,mode=755
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: ${MEM_LIMIT:-512m}
    cpus: ${CPU_LIMIT:-1.0}
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  # Same Compose-managed volumes as the online stack: created on first
  # deploy from the image directories (app ownership included), persistent
  # across recreate, isolated by VYSION_VOLUME_PREFIX when prefixed.
  vysion-reports:
    name: ${VYSION_VOLUME_PREFIX:-}vysion-reports
  vysion-state:
    name: ${VYSION_VOLUME_PREFIX:-}vysion-state
  vysion-certs:
    name: ${VYSION_VOLUME_PREFIX:-}vysion-certs
