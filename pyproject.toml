[project]
name = "vysion"
dynamic = ["version"]
description = "Internal modular FortiGate configuration audit service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cryptography==46.0.5",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "openpyxl==3.1.5",
  "pydantic-settings==2.10.1",
  "python-docx==1.2.0",
  "python-multipart==0.0.32",
  "starlette==1.6.0",
  "uvicorn==0.35.0",
]

[project.scripts]
vysion-admin = "vysion.admin_cli:cli"

[dependency-groups]
dev = [
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "pyyaml==6.0.2",
  "ruff==0.12.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vysion"]

[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>.+)$"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
