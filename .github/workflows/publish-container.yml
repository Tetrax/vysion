name: CI and publish container image

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-publish-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests and Ruff
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install locked dependencies
        run: uv sync --group dev

      - name: Run the test suite
        run: uv run pytest -q

      - name: Run Ruff
        run: uv run ruff check src tests

  frontend:
    name: Frontend tests, lint and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run the frontend tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Build the frontend
        run: npm run build

      - name: Audit the frontend dependencies
        run: npm audit --audit-level=high

  stack:
    name: Compose stack contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Refuse to resolve without an immutable image tag
        run: |
          if docker compose config --quiet; then
            echo "compose.yml resolved without IMAGE_TAG, the immutable tag must be required" >&2
            exit 1
          fi

      - name: Render the final stack on 127.0.0.1:8080
        run: IMAGE_TAG="sha-$(git rev-parse HEAD)" docker compose config > /tmp/vysion-stack-8080.yml

      - name: Render the temporary validation stack on 127.0.0.1:18080
        run: HOST_PORT=18080 IMAGE_TAG="sha-$(git rev-parse HEAD)" docker compose config > /tmp/vysion-stack-18080.yml

      - name: Assert loopback bind, exact external volume and no obsolete network
        run: |
          for rendered in /tmp/vysion-stack-8080.yml /tmp/vysion-stack-18080.yml; do
            grep -q 'host_ip: 127.0.0.1' "$rendered"
            grep -q 'name: vysion-reports' "$rendered"
            grep -q 'external: true' "$rendered"
            if grep -q 'Subnet-Docker' "$rendered"; then
              echo "obsolete Subnet-Docker network found in $rendered" >&2
              exit 1
            fi
            if grep -q 'ssl' "$rendered"; then
              echo "internal TLS material found in $rendered" >&2
              exit 1
            fi
          done
          grep -q 'published: "8080"' /tmp/vysion-stack-8080.yml
          grep -q 'published: "18080"' /tmp/vysion-stack-18080.yml

  publish:
    name: Publish container image
    needs:
      - python
      - frontend
      - stack
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and publish image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          pull: true
          tags: |
            ghcr.io/tetrax/vysion:latest
            ghcr.io/tetrax/vysion:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VYSION_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
