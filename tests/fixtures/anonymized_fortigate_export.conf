#config-version=FGT-7.2.x-FW-build0000-000000:opmode=0:vdom=0:user=synthetic
# Fixture synthétique anonymisée — aucune donnée client
# Export CLI représentatif avec commentaires Unicode
config system global
    set hostname "edge-lab.example"
    set admintimeout 15
    set timezone "Etc/UTC"
end
config system dns
    set primary 192.0.2.53
    set secondary 198.51.100.53
end
config system interface
    edit "wan1"
        set vdom "root"
        set ip 192.0.2.10 255.255.255.0
        set allowaccess ping https
        set type physical
        set role wan
        set alias "Accès opérateur — laboratoire"
        config secondaryip
            edit 1
                set ip 198.51.100.10 255.255.255.255
                set allowaccess ping
            next
        end
    next
    edit "port1"
        set vdom "root"
        set ip 203.0.113.1 255.255.255.0
        set allowaccess ping
        set description "Réseau interne générique"
        set role lan
    next
end
config system admin
    edit "secops"
        set accprofile "super_admin"
        set vdom "root"
        set two-factor fortitoken
        set email-to "secops@example.invalid"
        config dashboard
            edit 1
                set name "Vue sécurité"
            next
        end
    next
end
config firewall address
    edit "example-documentation-net"
        set subnet 203.0.113.0 255.255.255.0
        set comment "Objet non audité — ignoré"
    next
end
config firewall policy
    edit 1
        set name "outbound-demo"
        set srcintf "port1"
        set dstintf "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set logtraffic all
    next
end
