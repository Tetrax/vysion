#config-version=FG60E-7.2.8:build0000
# Fixture synthétique anonymisée — aucune donnée client
# Export CLI représentatif avec commentaires Unicode
config system global
    set hostname "edge-lab.example"
    set admintimeout 15
    set timezone "Etc/UTC"
end
config system dns
    set primary 192.0.2.53
    set secondary 198.51.100.53
end
config system interface
    edit "wan1"
        set vdom "root"
        set ip 192.0.2.10 255.255.255.0
        set allowaccess ping
        set type physical
        set role wan
        set alias "Accès opérateur — laboratoire"
        config secondaryip
            edit 1
                set ip 198.51.100.10 255.255.255.255
                set allowaccess ping
            next
        end
    next
    edit "port1"
        set vdom "root"
        set ip 203.0.113.1 255.255.255.0
        set allowaccess ping
        set description "Réseau interne générique"
        set role lan
    next
end
config system admin
    edit "secops"
        set accprofile "super_admin"
        set vdom "root"
        set two-factor fortitoken
        set email-to "secops@example.invalid"
        config dashboard
            edit 1
                set name "Vue sécurité"
            next
        end
    next
end
config system zone
    edit "trusted"
        set interface "port1"
    next
end
config log setting
    set fwpolicy-implicit-log enable
end
config user local
    edit "vpn-demo-user"
        set type password
        set two-factor fortitoken
    next
end
config user ldap
    edit "directory-demo"
        set secure ldaps
        set ca-cert "CA_Cert_1"
    next
end
config firewall address
    edit "example-documentation-net"
        set subnet 203.0.113.0 255.255.255.0
        set comment "Objet non audité — ignoré"
    next
end
config firewall ssl-ssh-profile
    edit "certificate-inspection-demo"
        set profile-type certificate-inspection
    next
end
config firewall service custom
    edit "HTTPS-explicit"
        set tcp-portrange 443
    next
    edit "sensitive-protocols-deny"
        set tcp-portrange 88 137-139 389 445 636
        set udp-portrange 88 137-139 389 1812-1813
    next
end
config system external-resource
    edit "IPV4_CTI_SNS"
        set status enable
    next
    edit "IPV4_SNS"
        set status enable
    next
    edit "HASH_CTI_SNS_SHA1"
        set status enable
    next
    edit "HASH_CTI_SNS_SHA256"
        set status enable
    next
    edit "HASH_SNS_SHA1"
        set status enable
    next
    edit "HASH_SNS_SHA256"
        set status enable
    next
    edit "FQDN_SNS"
        set status enable
    next
    edit "URL_SNS"
        set status enable
    next
    edit "FQDN_CTI_SNS"
        set status enable
    next
    edit "URL_CTI_SNS"
        set status enable
    next
end
config firewall policy
    edit 1
        set name "outbound-demo"
        set status enable
        set srcintf "trusted"
        set dstintf "wan1"
        set srcaddr "example-documentation-net"
        set dstaddr "IPV4_CTI_SNS" "IPV4_SNS"
        set action accept
        set schedule "always"
        set service "HTTPS-explicit"
        set internet-service-name "VPN-Anonymous.VPN" "Tor-Relay.Node" "Spam-Spamming.Server" "Proxy-Proxy.Server" "Phishing-Phishing.Server" "Malicious-Malicious.Server" "Botnet-C&C.Server" "Blockchain-Crypto.Mining.Pool"
        set logtraffic utm
        set utm-status enable
        set ssl-ssh-profile "certificate-inspection-demo"
        set webfilter-profile "web-safe"
        set dnsfilter-profile "dns-safe"
        set av-profile "av-safe"
        set ips-sensor "ips-safe"
        set application-list "app-safe"
    next
    edit 2
        set name "deny-sensitive-protocols"
        set status enable
        set srcintf "trusted"
        set dstintf "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "sensitive-protocols-deny"
        set logtraffic all
    next
end
config firewall vip
    edit "public-documentation-vip"
        set extintf "wan1"
        set extip 198.51.100.20
        set mappedip "203.0.113.20"
    next
    edit "public-documentation-vserver"
        set type server-load-balance
        set extintf "wan1"
        config realservers
            edit 1
                set ip 203.0.113.21
                set port 443
            next
        end
    next
end
config vpn ssl settings
    set status disable
end
config system autoupdate schedule
    set status enable
    set frequency automatic
end
config webfilter profile
    edit "web-safe"
        config web
            set blocklist enable
        end
        config ftgd-wf
            set options error-allow
            config filters
                edit 1
                    set category 207
                next
                edit 2
                    set category 209
                    set action block
                next
                edit 3
                    set category 210
                    set action block
                next
            end
        end
    next
end
config dnsfilter profile
    edit "dns-safe"
        set external-ip-blocklist "IPV4_CTI_SNS" "IPV4_SNS"
        config ftgd-dns
            set options error-allow
            config filters
                edit 1
                    set category 211
                    set action block
                next
                edit 2
                    set category 212
                    set action block
                next
            end
        end
    next
end
config antivirus profile
    edit "av-safe"
        set external-blocklist-enable-all enable
        set analytics-db enable
    next
end
config ips sensor
    edit "ips-safe"
        set block-malicious-url enable
        set scan-botnet-connections block
    next
end
config application list
    edit "app-safe"
        config entries
            edit 1
                set category 2
                set action block
            next
            edit 2
                set category 6
                set action block
            next
            edit 3
                set category 7
                set action block
            next
        end
    next
end
config vpn ipsec phase1-interface
    edit "lab-ipsec-p1"
        set interface "wan1"
        set ike-version 2
        set dhgrp 14
        set proposal aes256-sha256
    next
end
config vpn ipsec phase2-interface
    edit "lab-ipsec-p2"
        set phase1name "lab-ipsec-p1"
        set dhgrp 14
        set proposal aes256-sha256
    next
end
