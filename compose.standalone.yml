# Standalone deployment: this container terminates TLS itself with the
# certificate imported through the administrator UI (PEM/PKCS#12) and
# serves HTTPS on 443. The loopback plaintext port stays only for the
# container healthcheck.
#
# ONLINE install, one-click update: the image is tracked through the
# `stable` channel — a tag CI promotes only after the main gates pass
# (never from a PR) — so Portainer's "Update the stack" re-acquires the
# manifest and recreates the container without any variable to edit.
# No IMAGE_DIGEST is entered anywhere in this stack; the digest and the
# commit of what actually runs stay verifiable (see docs/OPERATIONS.md
# « Vérifier l'image réellement exécutée »), and an exceptional rollback
# pins `ghcr.io/tetrax/vysion:sha-<commit>` or the digest in this file.
#
#   TLS_HOSTNAME=vysion.example.com \
#     docker compose -f compose.standalone.yml config
#
# TLS_HOSTNAME is the ONLY required Portainer variable: it is the DNS name
# this instance serves, passed to the application under the internal name
# it has always read (VYSION_TLS_HOSTNAME).
#
# Optional, deterministic network attachment — all three empty by default,
# so a stack deployed without them behaves exactly as it always did:
#
#   DOCKER_NETWORK=<name>           attach to that Docker network
#   DOCKER_NETWORK_EXTERNAL=true    require it to pre-exist (default false)
#   IPV4_ADDRESS=<ipv4>             static address on that network
#
# See the `networks` section below and docs/OPERATIONS.md.
services:
  vysion:
    image: ghcr.io/tetrax/vysion:stable
    # "Update the stack" must re-resolve `stable` on every deployment:
    # without an explicit always pull, compose keeps whatever image
    # already carries that tag locally and never recreates the container.
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-443}:443"
    networks:
      # The single attachment point of the container. Left empty this is the
      # plain stack network Compose already creates today.
      default:
        # Static IPv4 (optional): empty => Compose drops the key and Docker
        # assigns an address as usual (no value imposed). A value outside the
        # subnet of the target network is refused by the daemon before any
        # container exists ("no configured subnet contains IP address ...").
        ipv4_address: ${IPV4_ADDRESS:-}
    environment:
      VYSION_REPORT_DIRECTORY: /app/data/reports
      VYSION_REPORT_TTL_SECONDS: ${REPORT_TTL_SECONDS:-3600}
      VYSION_MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}
      VYSION_FORTIGUARD_STATUS_URL: ${FORTIGUARD_STATUS_URL:-https://www.fortiguard.com/}
      VYSION_TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-127.0.0.1/32}
      VYSION_PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      VYSION_TLS_BACKEND: local
      # The operator enters the generic TLS_HOSTNAME in Portainer; the
      # application keeps reading the internal name it has always read.
      VYSION_TLS_HOSTNAME: ${TLS_HOSTNAME:?set TLS_HOSTNAME to the DNS name this instance serves}
    volumes:
      - vysion-reports:/app/data/reports
      - vysion-state:/app/data/state
      - vysion-certs:/app/certs
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/run:size=1m,uid=10001,gid=10001,mode=755
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: ${MEM_LIMIT:-512m}
    cpus: ${CPU_LIMIT:-1.0}
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  # Compose-managed named volumes with the stable production names: a fresh
  # Git Stack deploys with zero host command (Portainer never pre-creates
  # them), Docker initialises each empty volume from the image directory —
  # app ownership (uid 10001) included — and the data survives recreate.
  vysion-reports:
    name: ${VYSION_VOLUME_PREFIX:-}vysion-reports
  vysion-state:
    name: ${VYSION_VOLUME_PREFIX:-}vysion-state
  vysion-certs:
    name: ${VYSION_VOLUME_PREFIX:-}vysion-certs

networks:
  # Stack network. By default the Compose project network (<project>_default),
  # created by Compose itself: no host-specific value, no prerequisite —
  # the historical, unchanged behaviour.
  #
  # To attach Vysion to an EXISTING Docker network, set in the Portainer
  # Environment variables:
  #   DOCKER_NETWORK=<network name>     name of the network to join
  #   DOCKER_NETWORK_EXTERNAL=true      optional: the network must already
  #                                     exist, otherwise Compose may create
  #                                     a homonym of its own (default false)
  #   IPV4_ADDRESS=<ipv4>               optional: static address — the target
  #                                     network must own a subnet containing
  #                                     it, else the daemon refuses the
  #                                     container
  # All three are optional: left empty they render nothing and the stack
  # keeps its own default network. No subnet, address, network name or port
  # of any specific site is ever pinned here.
  default:
    # Empty => Compose drops the key and names the network itself.
    name: ${DOCKER_NETWORK:-}
    external: ${DOCKER_NETWORK_EXTERNAL:-false}
