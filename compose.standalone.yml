# Standalone deployment: this container terminates TLS itself with the
# certificate imported through the administrator UI (PEM/PKCS#12) and
# serves HTTPS on 443. The loopback plaintext port stays only for the
# container healthcheck.
#
# ONLINE install, one-click update: the image is tracked through the
# `stable` channel — a tag CI promotes only after the main gates pass
# (never from a PR) — so Portainer's "Update the stack" re-acquires the
# manifest and recreates the container without any variable to edit.
# No IMAGE_DIGEST is entered anywhere in this stack; the digest and the
# commit of what actually runs stay verifiable (see docs/OPERATIONS.md
# « Vérifier l'image réellement exécutée »), and an exceptional rollback
# pins `ghcr.io/tetrax/vysion:sha-<commit>` or the digest in this file.
#
#   VYSION_TLS_HOSTNAME=vysion.example.com \
#     docker compose -f compose.standalone.yml config
services:
  vysion:
    image: ghcr.io/tetrax/vysion:stable
    # "Update the stack" must re-resolve `stable` on every deployment:
    # without an explicit always pull, compose keeps whatever image
    # already carries that tag locally and never recreates the container.
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-443}:443"
    environment:
      VYSION_REPORT_DIRECTORY: /app/data/reports
      VYSION_REPORT_TTL_SECONDS: ${REPORT_TTL_SECONDS:-3600}
      VYSION_MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}
      VYSION_FORTIGUARD_STATUS_URL: ${FORTIGUARD_STATUS_URL:-https://www.fortiguard.com/}
      VYSION_TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-127.0.0.1/32}
      VYSION_PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      VYSION_TLS_BACKEND: local
      VYSION_TLS_HOSTNAME: ${VYSION_TLS_HOSTNAME:?set VYSION_TLS_HOSTNAME to the DNS name this instance serves}
    volumes:
      - vysion-reports:/app/data/reports
      - vysion-state:/app/data/state
      - vysion-certs:/app/certs
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/run:size=1m,uid=10001,gid=10001,mode=755
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: ${MEM_LIMIT:-512m}
    cpus: ${CPU_LIMIT:-1.0}
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  # Compose-managed named volumes with the stable production names: a fresh
  # Git Stack deploys with zero host command (Portainer never pre-creates
  # them), Docker initialises each empty volume from the image directory —
  # app ownership (uid 10001) included — and the data survives recreate.
  vysion-reports:
    name: ${VYSION_VOLUME_PREFIX:-}vysion-reports
  vysion-state:
    name: ${VYSION_VOLUME_PREFIX:-}vysion-state
  vysion-certs:
    name: ${VYSION_VOLUME_PREFIX:-}vysion-certs
